<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<style>
	.icon {
		fill: #3C4043;

		@media (prefers-color-scheme: dark) {
			fill: #C1C6DD;
		}

		transform: scale(0.86);
		transform-origin: center;
	}
	</style>
	<defs>
		<line id="line" x1="50" y1="26" x2="100" y2="26" />
	</defs>
	<mask id="mask">
		<rect width="100" height="100" fill="white" />
		<g stroke="black" stroke-width="10" fill="white">
			<use transform="rotate(0)" transform-origin="center" href="#line" />
			<use transform="rotate(120)" transform-origin="center" href="#line" />
			<use transform="rotate(240)" transform-origin="center" href="#line" />
			<circle cx="50" cy="50" r="24" />
		</g>
	</mask>

	<circle class="icon" cx="50" cy="50" r="50" mask="url(#mask)" />
</svg>
